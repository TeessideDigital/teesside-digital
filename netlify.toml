# Netlify Configuration for Teesside Digital

[build]
  command = "npm run build"
  publish = "dist"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  port = 3000

# Redirects

# Canonical domain enforcement: www -> apex (non-www).
# Must come before the catch-all 404 rule below -- Netlify evaluates
# redirects top to bottom and applies the first match. This rule also
# needs force = true, which is easy to miss and get wrong: without it,
# Netlify only fires a redirect when no real file matches the request
# path, and on this site every real page IS a matching file, so the
# redirect would silently never trigger for any actual page. force = true
# means "redirect unconditionally, regardless of whether a file exists,"
# which is what canonical-domain enforcement actually needs -- every
# single request to the www host, no exceptions, gets sent to the apex
# domain. This keeps only one URL per page indexable (matches the
# canonical tags and og:url already generated in BaseLayout.astro),
# rather than Google treating www and non-www as two separate,
# duplicate-content versions of the same site.
[[redirects]]
  from = "https://www.teessidedigital.uk/*"
  to = "https://teessidedigital.uk/:splat"
  status = 301
  force = true

# Retired V1 URLs. Each old address goes permanently to its closest V2 page,
# so no existing link or search result breaks. These must stay above the
# catch-all 404 rule: Netlify applies the first match. Netlify matches a path
# with or without its trailing slash, so one rule covers both forms.
[[redirects]]
  from = "/services/web-development"
  to = "/services/#websites-web-development"
  status = 301

[[redirects]]
  from = "/services/ai-automation"
  to = "/services/#automation-ai"
  status = 301

# No matching V2 section: security is an engineering discipline, not a service.
[[redirects]]
  from = "/services/cybersecurity"
  to = "/services/"
  status = 301

# Work stays withheld until real evidence passes the evidence gate.
[[redirects]]
  from = "/work"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/work/*"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    # Browsers that have seen the site over HTTPS keep using HTTPS for a year.
    # No preload and no includeSubDomains: add them only as a deliberate step.
    Strict-Transport-Security = "max-age=31536000"
    # Prevent browsers from MIME-sniffing
    X-Content-Type-Options = "nosniff"
    # The site is never shown inside a frame (clickjacking protection)
    X-Frame-Options = "DENY"
    # Disable legacy XSS filter (modern browsers don't need this)
    X-XSS-Protection = "0"
    # Control how much referrer info is shared
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Disable access to browser APIs the site never uses
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    # Everything loads from this site only. Inline scripts are allowed one by
    # one, by hash: if a script in the shell or a route changes, its hash here
    # must change too. Run "npm run check:csp" after a build to compare this
    # line with the built pages. Inline styles are allowed because Astro inlines
    # small stylesheets and the product drawings use style attributes.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-+0brCx8++xz3SqsF7nn8s8LOHkjHRZI1WYDnZwvDLRg=' 'sha256-7OHYQNKYXUVQBE/H41vCPt+WZZHuRB8KmfNc8JOsTTI=' 'sha256-P2jcKdKc8w0P5iHtuaGEijdDjmt533wuepHFB5bns+Y=' 'sha256-eB4Vr3m4fdNpi3qpA0oCNqYbTrOSSKVlAD8XItjjD14=' 'sha256-cm8QUzWybQm9WidN7M7zgeBTH2ocMCtQ8wiCjl/KrsI='; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'"

# Cache policy for hashed assets (safe to cache forever)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache policy for images (can update, so shorter TTL)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Cache policy for HTML: browsers check for a new version on every visit,
# so a deploy shows at once. This matches Netlify's default for the other
# pages, which are served from folder URLs and never match "/*.html".
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Form handling
[build.processing]
  skip_processing = false

[build.processing.html]
  skip_processing = false

# Environment
[context.production]
  environment = { NODE_ENV = "production" }

[context.deploy-preview]
  environment = { NODE_ENV = "development" }

[context.branch-deploy]
  environment = { NODE_ENV = "development" }
