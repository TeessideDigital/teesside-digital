# Netlify Configuration for Teesside Digital

[build]
  command = "npm run build"
  publish = "dist"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  port = 3000

# Redirects

# Canonical domain enforcement: www -> apex (non-www).
# Must come before the catch-all 404 rule below -- Netlify evaluates
# redirects top to bottom and applies the first match. This rule also
# needs force = true, which is easy to miss and get wrong: without it,
# Netlify only fires a redirect when no real file matches the request
# path, and on this site every real page IS a matching file, so the
# redirect would silently never trigger for any actual page. force = true
# means "redirect unconditionally, regardless of whether a file exists,"
# which is what canonical-domain enforcement actually needs -- every
# single request to the www host, no exceptions, gets sent to the apex
# domain. This keeps only one URL per page indexable (matches the
# canonical tags and og:url already generated in BaseLayout.astro),
# rather than Google treating www and non-www as two separate,
# duplicate-content versions of the same site.
[[redirects]]
  from = "https://www.teessidedigital.uk/*"
  to = "https://teessidedigital.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent browsers from MIME-sniffing
    X-Content-Type-Options = "nosniff"
    # Prevent framing by external sites (clickjacking protection)
    X-Frame-Options = "SAMEORIGIN"
    # Disable legacy XSS filter (modern browsers don't need this)
    X-XSS-Protection = "0"
    # Control how much referrer info is shared
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Disable access to browser APIs unless explicitly allowed
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"

# Cache policy for hashed assets (safe to cache forever)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache policy for images (can update, so shorter TTL)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Cache policy for HTML (pages update frequently)
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Form handling
[build.processing]
  skip_processing = false

[build.processing.html]
  skip_processing = false

# Environment
[context.production]
  environment = { NODE_ENV = "production" }

[context.deploy-preview]
  environment = { NODE_ENV = "development" }

[context.branch-deploy]
  environment = { NODE_ENV = "development" }
