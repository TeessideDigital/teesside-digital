<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Teesside Digital social image source</title>
    <!-- Source for public/images/og-default.jpg. Open at 1200 x 630 and
         screenshot the page; see README.md. Fonts and the mark are the site's
         own files, so nothing is fetched from another origin. -->
    <style>
      @font-face {
        font-family: "Instrument Sans";
        src: url("../../public/fonts/instrument-sans/instrument-sans-variable.woff2")
          format("woff2");
        font-weight: 400 700;
      }
      @font-face {
        font-family: "Instrument Serif";
        src: url("../../public/fonts/instrument-serif/instrument-serif-regular.woff2")
          format("woff2");
        font-weight: 400;
      }
      html,
      body {
        margin: 0;
      }
      body {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        inline-size: 1200px;
        block-size: 630px;
        padding: 72px 80px;
        background: #15191f;
        color: #f6f7f8;
        font-family: "Instrument Sans", sans-serif;
      }
      img {
        display: block;
        inline-size: 72px;
        block-size: 72px;
      }
      h1 {
        margin: 0;
        max-inline-size: 960px;
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 84px;
        font-weight: 400;
        line-height: 1.04;
        letter-spacing: -0.015em;
      }
      .rule {
        inline-size: 72px;
        block-size: 4px;
        margin-block-end: 22px;
        background: #f0a04b;
      }
      p {
        margin: 0;
        font-size: 26px;
        line-height: 1.3;
        color: #b4c3cf;
      }
    </style>
  </head>
  <body>
    <img src="../../public/images/logo/teesside-digital-mark.svg" alt="" />
    <h1>Websites, business tools and practical automation.</h1>
    <div>
      <div class="rule"></div>
      <p>Teesside Digital, Hartlepool</p>
    </div>
  </body>
</html>
